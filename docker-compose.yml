# Local or staging stack: PostgreSQL + the app. Values come from your shell or a .env file
# next to this file; nothing secret is written here.
#
#   POSTGRES_PASSWORD=... APP_URL=http://localhost:3000 docker compose up --build
#   docker compose run --rm tools db:migrate
#   docker compose run --rm -e SEED_DEMO_PASSWORD=... tools db:seed     # demo data, never in production

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kita
      POSTGRES_DB: kita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kita -d kita"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:?Set APP_URL, for example http://localhost:3000}
      DATABASE_URL: postgres://kita:${POSTGRES_PASSWORD}@db:5432/kita
      DB_SSL: disable # the database is on the private compose network
      TRUST_PROXY: ${TRUST_PROXY:-none}
      CRON_SECRET: ${CRON_SECRET:-}
      SENSOR_INGEST_TOKEN: ${SENSOR_INGEST_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "${PORT:-3000}:3000"

  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}

volumes:
  db-data:
