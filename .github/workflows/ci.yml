name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Runs every rule test against in-process PostgreSQL: no services needed.
      - run: npm test
      - run: npm run build
      # The committed API docs must match the route table.
      - run: npm run docs:api && git diff --exit-code docs/

  postgres:
    name: Tests on PostgreSQL (real concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kita
          POSTGRES_DB: kita_test
          POSTGRES_PASSWORD: ci-only-throwaway # an empty database that lives for one job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kita -d kita_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://kita:ci-only-throwaway@localhost:5432/kita_test
