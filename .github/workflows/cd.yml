name: CD

# Runs only after CI has passed on a push to main (or by hand from the Actions tab).
# 1. images: builds the Docker images and publishes them to GitHub Container Registry (ghcr.io).
#    It needs no secrets: GITHUB_TOKEN can publish packages for this repository.
# 2. deploy: off until you set the repository variable DEPLOY_ENABLED=true (Settings → Secrets and
#    variables → Actions → Variables). It follows the release order in docs/DEPLOYMENT.md:
#    migrate the database, start the new version, then wait until /api/v1/ready answers.
#    See docs/DEPLOYMENT.md, "Continuous deployment", for the variables and secrets it reads.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a newer one waits instead of cancelling a deployment halfway.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  images:
    name: Build and publish images
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.names.outputs.app }}
      tools: ${{ steps.names.outputs.tools }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}" # registry names must be lowercase
          {
            echo "app=ghcr.io/${owner}/kita-plus"
            echo "tools=ghcr.io/${owner}/kita-plus-tools"
            echo "tag=sha-$(git rev-parse --short=12 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image that serves traffic (pages and API in one Next.js server).
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.names.outputs.app }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image for migrations, the bootstrap and scheduled jobs (npm run <script>).
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: |
            ${{ steps.names.outputs.tools }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.tools }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "### Published images"
            echo "- \`${{ steps.names.outputs.app }}:${{ steps.names.outputs.tag }}\` (also \`:latest\`)"
            echo "- \`${{ steps.names.outputs.tools }}:${{ steps.names.outputs.tag }}\` (also \`:latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each release by hand.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    env:
      APP_URL: ${{ vars.APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - name: Check settings
        run: |
          missing=""
          [ -n "$APP_URL" ] || missing="$missing APP_URL(variable)"
          [ -n "$DEPLOY_HOOK_URL" ] || missing="$missing DEPLOY_HOOK_URL(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Set these on the production environment:$missing"
            exit 1
          fi

      - uses: docker/login-action@v3
        if: env.DATABASE_URL != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Migrations only add, so they are safe before the new version starts. Skipped when the host runs
      # them itself (for example as a release command) and DATABASE_URL is not given here.
      - name: Migrate the database
        if: env.DATABASE_URL != ''
        run: |
          docker run --rm \
            -e APP_ENV="${{ vars.APP_ENV || 'production' }}" \
            -e APP_URL -e DATABASE_URL \
            ${{ vars.DB_SSL && format('-e DB_SSL={0}', vars.DB_SSL) || '' }} \
            "${{ needs.images.outputs.tools }}:${{ needs.images.outputs.tag }}" db:migrate

      # The host's deploy hook (Render, Railway, Coolify, Portainer, a webhook on your own server...)
      # pulls the new image and restarts the app. The image reference is sent as JSON for hooks that use it.
      - name: Start the new version
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"image":"${{ needs.images.outputs.app }}:${{ needs.images.outputs.tag }}"}' \
            -o /dev/null -w "Deploy hook answered %{http_code}\n"

      - name: Wait until ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "${APP_URL%/}/api/v1/ready"; then echo; echo "Ready."; exit 0; fi
            sleep 10
          done
          echo "::error::${APP_URL%/}/api/v1/ready did not answer within 5 minutes"
          exit 1
